name: Deploy site

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 14 * * 1"     # every Monday ~8am Mountain (14:17 UTC): refresh Spotify top tracks
  workflow_dispatch:          # "Run workflow" button for a manual refresh

permissions:
  contents: write             # commit the updated JSON
  pages: write                # deploy to GitHub Pages
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Spotify top tracks
        if: github.event_name != 'push'
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
          TIME_RANGE: short_term
          LIMIT: "10"
        run: python3 scripts/fetch_top_tracks.py

      - name: Commit updated tracks
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/top-tracks.json
          git diff --staged --quiet || (git commit -m "chore: update Spotify top tracks" && git push)

      - name: Build site folder
        run: |
          mkdir -p _site
          cp index.html _site/
          [ -d data ] && cp -r data _site/ || true
          [ -d logos ] && cp -r logos _site/ || true

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
